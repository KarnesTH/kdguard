[package]
name = "kdguard"
version = "0.7.0"
edition = "2024"
description = "A CLI tool to generate secure and random passwords"
authors = ["KarnesTH <p_haehnel@hotmail.de>"]
license = "MIT"
repository = "https://github.com/KarnesTH/kdguard"

[dependencies]
chrono = "0.4.45"
clap = { version = "4.6.9", features = ["derive"] }
dirs = "7.0.0"
lingua-i18n-rs = "0.3.0"
log = "0.4.35"
ring = "0.17.14"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
simplelog = "0.12.2"
thiserror = "2.0.21"
toml = "1.2.2"

[profile.release]
opt-level = "z"
lto = true
strip = true